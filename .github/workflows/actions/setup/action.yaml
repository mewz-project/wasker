name: Setup

runs:
  using: composite
  steps:
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install LLVM
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libzstd-dev libxml2-dev
        export LLVM_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
        sudo mkdir -p /usr/local/llvm \
        && sudo wget ${LLVM_URL} -O /tmp/llvm.tar.xz \
        && sudo tar -xvf /tmp/llvm.tar.xz -C /usr/local/llvm \
        && sudo rm /tmp/llvm.tar.xz
        echo "/usr/local/llvm/LLVM-22.1.8-Linux-X64/bin" >> $GITHUB_PATH
        echo "LLVM_SYS_221_PREFIX=/usr/local/llvm/LLVM-22.1.8-Linux-X64" >> $GITHUB_ENV
